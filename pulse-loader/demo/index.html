<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pulse-loader demo</title>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 48px; }
    label { color: #fff; font-family: sans-serif; font-size: 13px; }
    .row  { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  </style>
  <script src="../src/pulse_loader.js"></script>
</head>
<body>
  <div class="row">
    <label>default</label>
    <pulse-loader style="height:60px; width:100vw;" />
  </div>
  <div class="row">
    <label>purple · slow</label>
    <pulse-loader count="40" duration="2.5" bar-height="40" color-top="#7F77DD" color-bot="#AFA9EC" style="height:80px; width:60vw;" />
  </div>
  <div class="row">
    <label>coral · fast</label>
    <pulse-loader count="80" duration="1" bar-height="20" color-top="#D85A30" color-bot="#F0997B" style="height:50px; width:80vw;" />
  </div>
</body>
</html>
